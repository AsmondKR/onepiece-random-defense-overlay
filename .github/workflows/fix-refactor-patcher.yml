name: Fix refactor patcher

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-patcher:
    if: github.head_ref == 'chore/stability-refactor-20260822'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/stability-refactor-20260822

      - name: Correct path escaping
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          old_memory = r'MemoryDiagnostics\\**\\*.cs'
          new_memory = r'MemoryDiagnostics\**\*.cs'
          old_tests = r'OrandOverlay.Tests\\**\\*.cs'
          new_tests = r'OrandOverlay.Tests\**\*.cs'
          if text.count(old_memory) != 2:
              raise SystemExit(f'expected two MemoryDiagnostics escaped paths, found {text.count(old_memory)}')
          if text.count(old_tests) != 1:
              raise SystemExit(f'expected one test escaped path, found {text.count(old_tests)}')
          text = text.replace(old_memory, new_memory).replace(old_tests, new_tests)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/fix-refactor-patcher.yml').unlink()

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/ci.yml .github/workflows/fix-refactor-patcher.yml
          git commit -m "Fix refactor patch path escaping"
          git push origin HEAD:chore/stability-refactor-20260822
