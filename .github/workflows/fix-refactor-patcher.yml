name: Fix refactor patcher

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-patcher:
    if: github.head_ref == 'chore/stability-refactor-20260822'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/stability-refactor-20260822

      - name: Make test source exclusion idempotent
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          start = text.index('          project = replace_once(')
          end = text.index('          project_path.write_text', start)
          replacement = '''          if "OrandOverlay.Tests" not in project:
              memory_line = project.index('    <Compile Remove="MemoryDiagnostics')
              insert_at = project.index("\\n", memory_line) + 1
              slash = chr(92)
              project = (project[:insert_at]
                         + f'    <Compile Remove="OrandOverlay.Tests{slash}**{slash}*.cs" />\\n'
                         + project[insert_at:])

          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/fix-refactor-patcher.yml').unlink()

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/ci.yml .github/workflows/fix-refactor-patcher.yml
          git commit -m "Make test exclusion patch idempotent"
          git push origin HEAD:chore/stability-refactor-20260822
