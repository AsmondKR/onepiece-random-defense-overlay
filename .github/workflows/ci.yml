name: Apply recommendation cap fix

on:
  push:
    branches:
      - chore/stability-refactor-20260822

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/stability-refactor-20260822

      - name: Apply targeted fix
        run: python scripts/fix_required_support_cap.py

      - name: Remove temporary files
        shell: bash
        run: |
          rm -f scripts/fix_required_support_cap.py
          rm -f docs/cap-fix-trigger.txt

      - name: Commit code changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- RecommendationEngine.cs MainWindow.xaml.cs SmokeTests/Program.cs scripts/fix_required_support_cap.py docs/cap-fix-trigger.txt
          git commit -m "Preserve required supports when enforcing recommendation limits"
          git push origin HEAD:chore/stability-refactor-20260822
