name: Apply remaining refactor

on:
  push:
    branches:
      - chore/stability-refactor-20260822

permissions:
  contents: write

jobs:
  apply-refactor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/stability-refactor-20260822

      - name: Apply code changes
        run: python scripts/apply_remaining_refactor.py

      - name: Remove temporary patch files
        shell: bash
        run: |
          rm -f scripts/apply_remaining_refactor.py
          rm -f docs/refactor-trigger.txt

      - name: Commit code changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- RecommendationEngine.cs RecommendationResultPolicy.cs RecommendationCommunityPriorities.cs MainWindow.xaml.cs WarcraftMemoryRecognitionService.cs App.xaml.cs OrandOverlay.csproj OrandOverlay.Tests scripts/apply_remaining_refactor.py docs/refactor-trigger.txt
          git commit -m "Complete stability and test refactor [remaining-refactor-applied]"
          git push origin HEAD:chore/stability-refactor-20260822
