name: Apply remaining refactor

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-refactor:
    if: github.head_ref == 'chore/stability-refactor-20260822'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/stability-refactor-20260822

      - name: Restore baseline CI and run patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          Path('.github/workflows/ci.yml').write_text('''name: CI

          on:
            push:
              branches:
                - main
                - 'chore/**'
                - 'fix/**'
                - 'feature/**'
            pull_request:

          jobs:
            build-and-smoke:
              runs-on: windows-latest
              timeout-minutes: 15

              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Setup .NET 8
                  uses: actions/setup-dotnet@v4
                  with:
                    dotnet-version: '8.0.x'

                - name: Restore app
                  run: dotnet restore OrandOverlay.csproj

                - name: Build app
                  run: dotnet build OrandOverlay.csproj -c Release --no-restore

                - name: Restore smoke tests
                  run: dotnet restore SmokeTests/OrandOverlay.SmokeTests.csproj

                - name: Run smoke tests
                  run: dotnet run --project SmokeTests/OrandOverlay.SmokeTests.csproj -c Release
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          workflow = Path('.github/workflows/apply-remaining-refactor.yml').read_text(encoding='utf-8')
          step = workflow.index('      - name: Apply code and test refactor')
          start = workflow.index('        run: |\n', step) + len('        run: |\n')
          end = workflow.index('\n      - name: Commit patched files', start)
          block = workflow[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          script = '\n'.join(lines) + '\n'

          faulty_start = script.index('old_priority_lookup =')
          faulty_end = script.index('\ncascade_marker =', faulty_start)
          replacement = '''priority_pattern = re.compile(
              r'        IReadOnlyDictionary<string, int>\\? priorities = null;\\n'
              r'.*?'
              r'        if \\(priorities is null\\) return 0;',
              re.S,
          )
          engine, priority_count = priority_pattern.subn(
              '        var priorities = RecommendationCommunityPriorities.ForGoal(goal);\\n'
              '        if (priorities is null) return 0;',
              engine,
              count=1,
          )
          if priority_count != 1:
              raise SystemExit(
                  f"community priority lookup: expected one match, found {priority_count}")

          '''.replace('\n          ', '\n')
          script = script[:faulty_start] + replacement + script[faulty_end + 1:]
          Path('/tmp/apply_remaining_refactor.py').write_text(script, encoding='utf-8')
          PY

          python /tmp/apply_remaining_refactor.py
          rm -f docs/refactor-trigger.txt

      - name: Commit final changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- RecommendationEngine.cs RecommendationResultPolicy.cs RecommendationCommunityPriorities.cs MainWindow.xaml.cs WarcraftMemoryRecognitionService.cs App.xaml.cs OrandOverlay.csproj OrandOverlay.Tests .github/workflows/ci.yml .github/workflows/apply-remaining-refactor.yml docs/refactor-trigger.txt
          git commit -m "Complete stability and test refactor [remaining-refactor-applied]"
          git push origin HEAD:chore/stability-refactor-20260822
