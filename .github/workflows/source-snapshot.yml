name: Source Snapshot

on:
  push:
    branches:
      - chore/stability-refactor-20260822

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot-${{ github.run_number }}
          path: |
            **
            !.git/**
            !bin/**
            !obj/**
          include-hidden-files: true
          retention-days: 1
